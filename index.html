<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Augmented Face</title>
    <link rel="stylesheet" type="text/css" href="./style.css">
    <script src="./libraries/p5.min.js"></script>
  </head>
  <body>
    <div
      id="scent-oracle"
      class="scent-oracle scent-oracle--visible scent-oracle--waiting"
      aria-live="polite"
    >
      <p class="scent-oracle__waiting">Position your face</p>
      <div class="scent-oracle__loading">
        <span class="scent-oracle__spinner" aria-hidden="true"></span>
        <p class="scent-oracle__loading-text">Reading your aura…</p>
      </div>
      <div class="scent-oracle__reveal">
        <p class="scent-oracle__eyebrow">Your aura</p>
        <p class="scent-oracle__name"></p>
        <p class="scent-oracle__tagline"></p>
      </div>
    </div>
    <div id="perfume-ui" class="perfume-ui--hidden" aria-label="Scent visualization">
      <div class="perfume-ui__header">
        <span class="perfume-ui__title">Scent</span>
        <button
          type="button"
          id="oracle-reload"
          class="oracle-reload oracle-reload--hidden"
          aria-label="Draw a new scent"
        >
          ↻ New aura
        </button>
      </div>
      <div
        id="scent-picker"
        class="scent-picker"
        role="radiogroup"
        aria-label="Choose scent profile"
      >
        <label class="scent-picker__opt">
          <input type="radio" name="scent" value="alima" />
          <span class="scent-picker__label">Alima</span>
        </label>
        <label class="scent-picker__opt">
          <input type="radio" name="scent" value="aymeric" />
          <span class="scent-picker__label">Aymeric</span>
        </label>
        <label class="scent-picker__opt">
          <input type="radio" name="scent" value="jamie" />
          <span class="scent-picker__label">Jamie</span>
        </label>
        <label class="scent-picker__opt">
          <input type="radio" name="scent" value="paloma" />
          <span class="scent-picker__label">Paloma</span>
        </label>
      </div>
    </div>
    <script src="./sketch.js" type="module"></script>
  </body>
</html>
